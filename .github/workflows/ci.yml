name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt

      # Rustup reads rust-toolchain.toml and can override the toolchain selected
      # by the action. Keep this job on the development and release version.
      - name: Keep the job on the development Rust version
        run: echo "RUSTUP_TOOLCHAIN=1.97.1" >> "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features --locked

      - name: Build release executable
        run: cargo build --release --all-features --locked

  msrv:
    name: MSRV (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Check workspace with the minimum supported Rust version
        run: nix develop .#msrv -c cargo check --workspace --all-targets --locked

      - name: Test workspace libraries with the minimum supported Rust version
        run: nix develop .#msrv -c cargo test --workspace --lib --tests --locked
