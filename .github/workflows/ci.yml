name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy, rustfmt

      # The repository holds a rust-toolchain.toml that pins the development
      # toolchain for the Nix shell. Rustup reads that file and it overrides
      # the toolchain of this job. The variable keeps this job on the minimum
      # supported version.
      - name: Keep the job on the minimum supported Rust version
        run: echo "RUSTUP_TOOLCHAIN=1.85.0" >> "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features --locked

      - name: Build release executable
        run: cargo build --release --all-features --locked
