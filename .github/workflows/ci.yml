name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt

      # Rustup reads rust-toolchain.toml and can override the toolchain selected
      # by the action. Keep this job on the development and release version.
      - name: Keep the job on the development Rust version
        run: echo "RUSTUP_TOOLCHAIN=1.97.1" >> "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features --locked

      - name: Build release executable
        run: cargo build --release --all-features --locked

  examples:
    name: Examples (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Keep the job on the development Rust version
        run: echo "RUSTUP_TOOLCHAIN=1.97.1" >> "$GITHUB_ENV"

      # `docs/embedding.md` owns this list. The script reads that document, so
      # continuous integration cannot retain a contradictory partial list.
      - name: Run every required example
        run: ./scripts/run-required-examples.sh

      - name: Check that every feature module names its own example
        run: cargo test --locked -p kvim --test repository_policy

      # Every module link to an example is a plain path, so `cargo doc` cannot
      # resolve it. The policy test above owns that resolution. This step owns
      # the intra-doc links of the same documentation.
      - name: Check that every rustdoc link resolves
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps --all-features

  boundaries:
    name: Boundaries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Keep the job on the development Rust version
        run: echo "RUSTUP_TOOLCHAIN=1.97.1" >> "$GITHUB_ENV"

      # The script reads the layer table of `docs/architecture.md`, so the
      # architecture stays the only source of the permitted edges.
      - name: Reject every forbidden dependency edge
        run: ./scripts/check-dependency-edges.sh

      # `docs/architecture.md` requires a syntax-only consumer to compile no
      # LSP, no ratatui, and no editor. These builds prove that the crate stays
      # usable with no grammar and with one grammar alone.
      - name: Check the syntax package without a grammar and with one grammar
        run: |
          set -euo pipefail
          cargo check --locked -p kvim-syntax --no-default-features
          cargo check --locked -p kvim-syntax --no-default-features --features grammar-rust
          cargo check --locked -p kvim-syntax --no-default-features --features all-grammars

      # The public facade is memory-only by default. Worktree and grammar
      # closures remain explicit and independently selectable.
      - name: Check the embedded facade feature matrix
        run: |
          set -euo pipefail
          cargo check --locked -p kvim-embed
          cargo check --locked -p kvim-embed --no-default-features
          cargo check --locked -p kvim-embed --no-default-features --features review
          cargo check --locked -p kvim-embed --no-default-features --features worktree
          cargo check --locked -p kvim-embed --no-default-features --features grammar-rust
          cargo check --locked -p kvim-embed --no-default-features --features all-grammars

      # Supplied review is a pure facade feature. It must not reach worktree
      # services, terminal ownership, language support, or grammar packages.
      - name: Prove supplied review dependency isolation
        run: >-
          ./scripts/check-dependency-edges.sh --reject-features kvim-embed review
          crossterm kvim-language kvim-lsp kvim-runtime kvim-terminal notify
          tokio tokio-util tree-sitter

      # `kvim-language` supports a no-feature headless partition. `kvim-tui`
      # defaults to its no-grammar editor partition; grammar features imply it.
      - name: Check the language and presentation grammar matrices
        run: |
          set -euo pipefail
          cargo check --locked -p kvim-language --no-default-features
          cargo check --locked -p kvim-language --no-default-features --features grammar-rust
          cargo check --locked -p kvim-language --no-default-features --features all-grammars

          cargo check --locked -p kvim-tui
          cargo check --locked -p kvim-tui --no-default-features --features grammar-rust
          cargo check --locked -p kvim-tui --no-default-features --features all-grammars

      # `docs/architecture.md` keeps `kvim-lsp` at layer 2. A consumer that wants
      # diagnostics alone must therefore compile no terminal interface and no
      # editor state.
      - name: Prove the LSP package compiles no interface and no full editor
        run: >-
          ./scripts/check-dependency-edges.sh --reject kvim-lsp
          crossterm kvim-core kvim-editor kvim-tui kvim-ui ratatui

      # `kvim-ui` owns geometry, sidebars, which-key presentation, and host
      # composition. It stores one opaque surface identity, never buffer text.
      - name: Prove the interface package compiles no editor buffer
        run: >-
          ./scripts/check-dependency-edges.sh --reject kvim-ui
          kvim-core kvim-editor kvim-language kvim-lsp kvim-workspace

  external-consumer:
    name: External consumer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      # Cargo clones the checkout as one Git dependency, so the checkout must
      # hold complete history rather than one shallow commit.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Keep the job on the development Rust version
        run: echo "RUSTUP_TOOLCHAIN=1.97.1" >> "$GITHUB_ENV"

      # Each fixture is an independent workspace. A file URL still makes Cargo
      # clone this checkout as an outside-workspace, revision-pinned dependency.
      # This also makes pull-request merge commits available without remote auth.
      - name: Compile every independent external consumer
        run: ./scripts/check-external-consumer.sh --checked-out-repository

  msrv:
    name: MSRV (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      # The consumer check below clones this checkout as one Git dependency, so
      # the checkout must hold complete history rather than one shallow commit.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Check workspace with the minimum supported Rust version
        run: nix develop .#msrv -c cargo check --workspace --all-targets --locked

      - name: Test workspace libraries with the minimum supported Rust version
        run: nix develop .#msrv -c cargo test --workspace --lib --tests --locked

      # Use the same outside-workspace, revision-pinned file clone as the
      # development-toolchain job.
      - name: Compile every independent external consumer with the minimum supported Rust version
        run: nix develop .#msrv -c ./scripts/check-external-consumer.sh --checked-out-repository
