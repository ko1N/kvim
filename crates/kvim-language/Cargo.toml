[package]
name = "kvim-language"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
# Publishes the deterministic mock language server of the `mock` module.
#
# The editor wiring tests of `kvim-tui` drive the same mock as the protocol
# tests here, so one mock server covers every layer. The module is a test seam,
# never editor behavior, so a normal build leaves it out.
test-support = []

[dependencies]
# Kvim crates
kvim-core.workspace = true
kvim-runtime.workspace = true
kvim-settings.workspace = true

# Basics
thiserror.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Language analysis
tree-sitter.workspace = true
tree-sitter-asm.workspace = true
tree-sitter-bash.workspace = true
tree-sitter-c.workspace = true
tree-sitter-cpp.workspace = true
tree-sitter-css.workspace = true
tree-sitter-fish.workspace = true
tree-sitter-glsl.workspace = true
tree-sitter-go.workspace = true
tree-sitter-hcl.workspace = true
tree-sitter-highlight.workspace = true
tree-sitter-html.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-json.workspace = true
tree-sitter-lua.workspace = true
tree-sitter-md.workspace = true
tree-sitter-nix.workspace = true
tree-sitter-python.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-scss.workspace = true
tree-sitter-sequel.workspace = true
tree-sitter-toml-ng.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-xml.workspace = true
tree-sitter-yaml.workspace = true
tree-sitter-zig.workspace = true

# Runtime
tokio.workspace = true
tokio-util.workspace = true
