[package]
name = "kvim-language"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
# No grammar is bundled by default. In that supported configuration,
# `LanguageRegistry::first_release()` is empty, lookups return typed
# unsupported/none outcomes, and markup and service construction stay usable.
# Each feature forwards to the grammar of `kvim-syntax`. An adapter exists only
# while its grammar does, so a consumer compiles only the languages it names.
default = ["editor-services"]

editor-services = [
  "dep:kvim-core",
  "dep:kvim-runtime",
  "dep:kvim-syntax",
  "dep:pulldown-cmark",
  "dep:serde",
  "dep:tokio",
  "dep:tokio-util",
  "dep:tree-sitter",
]

# Publishes the deterministic mock language server of the `mock` module.
#
# The editor wiring tests of `kvim-tui` drive the same mock as the protocol
# tests here, so one mock server covers every layer. The module is a test seam,
# never editor behavior, so a normal build leaves it out.
#
# The mock hands prepared streams to one session, so it also needs the matching
# seam of `kvim-lsp`.
test-support = ["editor-services", "kvim-lsp/test-support"]

grammar-asm = ["editor-services", "kvim-syntax/grammar-asm"]
grammar-bash = ["editor-services", "kvim-syntax/grammar-bash"]
grammar-c = ["editor-services", "kvim-syntax/grammar-c"]
grammar-cpp = ["editor-services", "kvim-syntax/grammar-cpp"]
grammar-css = ["editor-services", "kvim-syntax/grammar-css"]
grammar-fish = ["editor-services", "kvim-syntax/grammar-fish"]
grammar-glsl = ["editor-services", "kvim-syntax/grammar-glsl"]
grammar-go = ["editor-services", "kvim-syntax/grammar-go"]
grammar-html = ["editor-services", "kvim-syntax/grammar-html"]
grammar-javascript = ["editor-services", "kvim-syntax/grammar-javascript"]
grammar-json = ["editor-services", "kvim-syntax/grammar-json"]
grammar-lua = ["editor-services", "kvim-syntax/grammar-lua"]
grammar-markdown = ["editor-services", "kvim-syntax/grammar-markdown"]
grammar-nix = ["editor-services", "kvim-syntax/grammar-nix"]
grammar-python = ["editor-services", "kvim-syntax/grammar-python"]
grammar-rust = ["editor-services", "kvim-syntax/grammar-rust"]
grammar-scss = ["editor-services", "kvim-syntax/grammar-scss"]
grammar-sql = ["editor-services", "kvim-syntax/grammar-sql"]
grammar-terraform = ["editor-services", "kvim-syntax/grammar-terraform"]
grammar-toml = ["editor-services", "kvim-syntax/grammar-toml"]
grammar-tsx = ["editor-services", "kvim-syntax/grammar-tsx"]
grammar-typescript = ["editor-services", "kvim-syntax/grammar-typescript"]
grammar-xml = ["editor-services", "kvim-syntax/grammar-xml"]
grammar-yaml = ["editor-services", "kvim-syntax/grammar-yaml"]
grammar-zig = ["editor-services", "kvim-syntax/grammar-zig"]

all-grammars = [
  "grammar-asm",
  "grammar-bash",
  "grammar-c",
  "grammar-cpp",
  "grammar-css",
  "grammar-fish",
  "grammar-glsl",
  "grammar-go",
  "grammar-html",
  "grammar-javascript",
  "grammar-json",
  "grammar-lua",
  "grammar-markdown",
  "grammar-nix",
  "grammar-python",
  "grammar-rust",
  "grammar-scss",
  "grammar-sql",
  "grammar-terraform",
  "grammar-toml",
  "grammar-tsx",
  "grammar-typescript",
  "grammar-xml",
  "grammar-yaml",
  "grammar-zig",
]

[dependencies]
# kvim crates
kvim-core = { workspace = true, optional = true }
kvim-lsp.workspace = true
kvim-path.workspace = true
kvim-runtime = { workspace = true, optional = true }
kvim-settings.workspace = true
kvim-syntax = { workspace = true, optional = true }

# Basics
thiserror.workspace = true

# Markup
pulldown-cmark = { workspace = true, optional = true }

# Serialization
serde = { workspace = true, optional = true }
serde_json.workspace = true

# Language analysis
tree-sitter = { workspace = true, optional = true }

# Runtime
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }

[dev-dependencies]
# kvim crates
# The protocol tests of this crate drive the mock over prepared streams, so the
# test build needs the stream seam of `kvim-lsp`.
kvim-lsp = { workspace = true, features = ["test-support"] }

# Runtime
tokio.workspace = true
