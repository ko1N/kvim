[package]
name = "kvim-workspace"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
# Publishes the temporary-directory helper of the `temp` module.
#
# Every filesystem test works inside its own directory and removes it when it
# finishes, so no test reads or writes the editor state directory of the user.
# The editor tests of `kvim-tui` need the same helper. The module is a test
# seam, never editor behavior, so a normal build leaves it out.
test-support = []

[dependencies]
# kvim crates
kvim-core.workspace = true
kvim-fuzzy.workspace = true
kvim-path.workspace = true
kvim-runtime.workspace = true
kvim-settings.workspace = true
kvim-ui.workspace = true

# Basics
thiserror.workspace = true

# Filesystem confinement
cap-std.workspace = true

# Review identity
blake3.workspace = true

# Runtime
tokio-util.workspace = true

[dev-dependencies]
# Runtime
#
# The Git tests drive one real status read through the bounded process service,
# which needs a Tokio runtime. No editor path of this crate starts one.
tokio.workspace = true
