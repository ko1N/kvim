[workspace]
members = [
  "crates/kvim",
  "crates/kvim-clipboard",
  "crates/kvim-core",
  "crates/kvim-editor",
  "crates/kvim-input",
  "crates/kvim-keymap",
  "crates/kvim-language",
  "crates/kvim-lsp",
  "crates/kvim-path",
  "crates/kvim-runtime",
  "crates/kvim-settings",
  "crates/kvim-syntax",
  "crates/kvim-terminal",
  "crates/kvim-tui",
  "crates/kvim-ui",
  "crates/kvim-workspace",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.94.1"
version = "0.1.0"

[workspace.dependencies]
# kvim crates
kvim-clipboard = { path = "crates/kvim-clipboard" }
kvim-core = { path = "crates/kvim-core" }
kvim-editor = { path = "crates/kvim-editor" }
kvim-input = { path = "crates/kvim-input" }
kvim-keymap = { path = "crates/kvim-keymap" }
kvim-language = { path = "crates/kvim-language" }
kvim-lsp = { path = "crates/kvim-lsp" }
kvim-path = { path = "crates/kvim-path" }
kvim-runtime = { path = "crates/kvim-runtime" }
kvim-settings = { path = "crates/kvim-settings" }
kvim-syntax = { path = "crates/kvim-syntax" }
kvim-terminal = { path = "crates/kvim-terminal" }
kvim-tui = { path = "crates/kvim-tui" }
kvim-ui = { path = "crates/kvim-ui" }
kvim-workspace = { path = "crates/kvim-workspace" }

# Basics
thiserror = "2.0"

# Filesystem confinement
cap-std = "4.0"

# Text storage
ropey = "1.6"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }

# Markup
pulldown-cmark = { version = "0.13", default-features = false }

# Language analysis
tree-sitter = "0.25"
tree-sitter-asm = "0.24"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-fish = "3.6"
tree-sitter-glsl = "0.2"
tree-sitter-go = "0.25"
tree-sitter-hcl = "1.1"
tree-sitter-highlight = "0.25"
tree-sitter-html = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-lua = "0.5"
tree-sitter-md = "0.5"
tree-sitter-nix = "0.3"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-scss = "1.0"
tree-sitter-sequel = "0.3"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-xml = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-zig = "1.1"

# Terminal
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
ratatui = "0.29"
unicode-width = "0.2"

# Runtime
notify = "8.2"
tokio = { version = "1.47", features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[profile.dev]
# Link time dominates an incremental build. Line tables keep a readable
# backtrace and a usable debugger stack, without the full type information.
debug = "line-tables-only"

[profile.dev.package."*"]
# A dependency changes rarely, and its debug information is never read while
# the editor itself is under development.
debug = false

[profile.release]
codegen-units = 1
lto = "thin"
# Keep unwinding, but never depend on it: a panic hook restores the terminal,
# because some platforms abort a panic without running any destructor.
panic = "unwind"
strip = "symbols"
