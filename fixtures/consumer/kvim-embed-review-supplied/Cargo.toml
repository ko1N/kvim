[workspace]

[package]
name = "consume-kvim-embed-review-supplied"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
publish = false

[dependencies]
kvim-embed = { git = "https://github.com/ko1N/kvim.git", rev = "6cdbd15", default-features = false, features = ["review"] }
kvim-path = { git = "https://github.com/ko1N/kvim.git", rev = "6cdbd15", default-features = false }
ratatui = { version = "0.29", default-features = false }
