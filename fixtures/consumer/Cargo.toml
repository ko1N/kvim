# One external consumer of the public kvim packages.
#
# The package is its own workspace root, so it proves that a consumer needs no
# shared parent workspace. `scripts/check-external-consumer.sh` copies this
# directory, rewrites `git` to the local repository and `rev` to the commit
# under test, and then compiles every combination of the public feature matrix.
# The values below record the form that an outside repository writes.
[workspace]

[package]
name = "kvim-consumer-fixture"
edition = "2024"
publish = false
rust-version = "1.94.1"
version = "0.1.0"

[dependencies]
# kvim public packages
kvim-keymap = { git = "https://github.com/ko1N/kvim.git", rev = "1faef123cdfe85164f19013042ee732cf1e6821c" }
kvim-lsp = { git = "https://github.com/ko1N/kvim.git", rev = "1faef123cdfe85164f19013042ee732cf1e6821c" }
kvim-path = { git = "https://github.com/ko1N/kvim.git", rev = "1faef123cdfe85164f19013042ee732cf1e6821c" }
kvim-syntax = { git = "https://github.com/ko1N/kvim.git", rev = "1faef123cdfe85164f19013042ee732cf1e6821c" }
kvim-tui = { git = "https://github.com/ko1N/kvim.git", rev = "1faef123cdfe85164f19013042ee732cf1e6821c" }
kvim-ui = { git = "https://github.com/ko1N/kvim.git", rev = "1faef123cdfe85164f19013042ee732cf1e6821c" }

# Terminal
#
# The public signatures use these ratatui types, so the consumer names the same
# compatible release.
ratatui = "0.29"

[features]
# The consumer bundles no grammar by default, exactly like the packages that it
# consumes. Each feature below enables one language in both the syntax package
# and the embedded editor, so one check covers both rows of the public feature
# matrix.
default = []

grammar-asm = ["kvim-syntax/grammar-asm", "kvim-tui/grammar-asm"]
grammar-bash = ["kvim-syntax/grammar-bash", "kvim-tui/grammar-bash"]
grammar-c = ["kvim-syntax/grammar-c", "kvim-tui/grammar-c"]
grammar-cpp = ["kvim-syntax/grammar-cpp", "kvim-tui/grammar-cpp"]
grammar-css = ["kvim-syntax/grammar-css", "kvim-tui/grammar-css"]
grammar-fish = ["kvim-syntax/grammar-fish", "kvim-tui/grammar-fish"]
grammar-glsl = ["kvim-syntax/grammar-glsl", "kvim-tui/grammar-glsl"]
grammar-go = ["kvim-syntax/grammar-go", "kvim-tui/grammar-go"]
grammar-html = ["kvim-syntax/grammar-html", "kvim-tui/grammar-html"]
grammar-javascript = ["kvim-syntax/grammar-javascript", "kvim-tui/grammar-javascript"]
grammar-json = ["kvim-syntax/grammar-json", "kvim-tui/grammar-json"]
grammar-lua = ["kvim-syntax/grammar-lua", "kvim-tui/grammar-lua"]
grammar-markdown = ["kvim-syntax/grammar-markdown", "kvim-tui/grammar-markdown"]
grammar-nix = ["kvim-syntax/grammar-nix", "kvim-tui/grammar-nix"]
grammar-python = ["kvim-syntax/grammar-python", "kvim-tui/grammar-python"]
grammar-rust = ["kvim-syntax/grammar-rust", "kvim-tui/grammar-rust"]
grammar-scss = ["kvim-syntax/grammar-scss", "kvim-tui/grammar-scss"]
grammar-sql = ["kvim-syntax/grammar-sql", "kvim-tui/grammar-sql"]
grammar-terraform = ["kvim-syntax/grammar-terraform", "kvim-tui/grammar-terraform"]
grammar-toml = ["kvim-syntax/grammar-toml", "kvim-tui/grammar-toml"]
grammar-tsx = ["kvim-syntax/grammar-tsx", "kvim-tui/grammar-tsx"]
grammar-typescript = ["kvim-syntax/grammar-typescript", "kvim-tui/grammar-typescript"]
grammar-xml = ["kvim-syntax/grammar-xml", "kvim-tui/grammar-xml"]
grammar-yaml = ["kvim-syntax/grammar-yaml", "kvim-tui/grammar-yaml"]
grammar-zig = ["kvim-syntax/grammar-zig", "kvim-tui/grammar-zig"]

all-grammars = ["kvim-syntax/all-grammars", "kvim-tui/all-grammars"]
